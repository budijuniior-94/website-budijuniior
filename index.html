
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Budi</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 0;
            color: #1e293b;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 25px;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            text-align: center;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Website Budi</h1>
        <p>My First Website on GitHub</p>
    </header>

    <main>
        <h2>Selamat Datang!</h2>
        <p>Ini adalah website pertama saya menggunakan GitHub Pages.</p>
        <button onclick="alert('Website berhasil berjalan!')">
            Klik Saya
        </button>
    </main>

</body>
</html>
